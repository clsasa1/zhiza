name: Gemini AI review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-ext-diff --unified=80 \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > review-diff.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --no-ext-diff --unified=80 \
              "${{ github.event.before }}" "${{ github.sha }}" > review-diff.txt
          else
            git diff --no-ext-diff --unified=80 HEAD^ HEAD > review-diff.txt
          fi
          test -s review-diff.txt
          if [ "$(wc -c < review-diff.txt)" -gt 120000 ]; then
            head -c 120000 review-diff.txt > review-diff-truncated.txt
            mv review-diff-truncated.txt review-diff.txt
          fi

      - name: Review diff with Gemini Flash
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DIFF_FILE: review-diff.txt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const diff = fs.readFileSync(process.env.DIFF_FILE, 'utf8')
            const prompt = `You are reviewing a software change. Analyze only the diff below.
            Report only actionable, high-confidence bugs, security problems, or regressions.
            Do not comment on style, formatting, or speculative concerns.
            If there are no findings, reply exactly: "AI review: no high-confidence issues found."
            For each finding include severity (critical/high/medium/low), file and line if available,
            explain the impact, and provide a concise fix suggestion.

            DIFF:
            ${diff}`

            const response = await fetch(
              'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' +
                encodeURIComponent(process.env.GEMINI_API_KEY),
              {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.1, maxOutputTokens: 2048 },
                }),
              },
            )
            if (!response.ok) {
              core.setFailed(`Gemini API returned ${response.status}: ${await response.text()}`)
              return
            }
            const data = await response.json()
            const review = data.candidates?.[0]?.content?.parts?.[0]?.text
            if (!review) {
              core.setFailed('Gemini returned no review text')
              return
            }

            const body = `## Gemini Flash review\n\n${review}\n\n<sub>Automated review for ${context.sha.slice(0, 7)}</sub>`
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              })
            }

      - name: Explain skipped review
        if: env.GEMINI_API_KEY == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "Set the GEMINI_API_KEY repository secret to enable automated reviews."
